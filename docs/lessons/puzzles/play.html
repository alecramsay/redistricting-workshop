<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redistricting Puzzles</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      color: #1A1A1A;
      padding: 20px 24px;
    }

    nav {
      margin-bottom: 6px;
    }

    .exit-link {
      font-size: 0.875rem;
      color: #555;
      text-decoration: none;
    }

    .exit-link:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .puzzle-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    label[for="puzzle-select"] {
      font-size: 0.875rem;
      font-weight: 600;
    }

    select#puzzle-select {
      font-size: 0.875rem;
      padding: 5px 8px;
      border: 1px solid #BBB;
      border-radius: 4px;
      background: #FFF;
      cursor: pointer;
    }

    .btn-reset {
      font-size: 0.875rem;
      padding: 5px 12px;
      border: 1px solid #BBB;
      border-radius: 4px;
      background: #FFF;
      cursor: pointer;
    }

    .btn-reset:hover {
      background: #EEE;
    }

    .view-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      font-size: 0.875rem;
    }

    .view-controls span {
      font-weight: 600;
    }

    .view-controls label {
      cursor: pointer;
    }

    .puzzle-goal {
      font-size: 0.875rem;
      color: #555;
      margin-bottom: 4px;
    }

    .puzzle-hint {
      font-size: 0.8rem;
      color: #888;
      font-style: italic;
      margin-bottom: 14px;
    }

    /* ── Game area: Districts box left, Map right ── */

    .game-area {
      display: flex;
      align-items: flex-start;
      gap: 28px;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    /* Districts box — framed to read as distinct from the map. */

    .districts-box {
      border: 3px solid #000;
      border-radius: 6px;
      padding: 12px 14px;
      background: #FFF;
      flex-shrink: 0;
    }

    .districts-col,
    .map-col {
      flex-shrink: 0;
    }

    /* District panel */

    .district-panel {
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .district-panel th {
      text-align: center;
      padding: 4px 8px 6px;
      color: #666;
      font-weight: 600;
      font-size: 0.78rem;
      border-bottom: 1px solid #CCC;
      white-space: nowrap;
    }

    .district-panel th.left {
      text-align: left;
    }

    .district-panel td {
      padding: 6px 8px;
      white-space: nowrap;
      text-align: center;
    }

    .district-panel td.left {
      text-align: left;
    }

    .d-row {
      cursor: pointer;
    }

    .d-row:hover td {
      background: #E8E8E8;
    }

    .d-row.active td {
      background: #DDEEFF;
    }

    .swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.2);
      vertical-align: middle;
    }

    .d-num {
      font-weight: 700;
    }

    .num-cell {
      font-variant-numeric: tabular-nums;
    }

    .c-yes {
      color: #166534;
      font-weight: 600;
    }

    .c-no {
      color: #B45309;
      font-weight: 600;
    }

    .c-na {
      color: #AAA;
    }

    .w-red {
      color: #991B1B;
      font-weight: 700;
    }

    .w-blue {
      color: #1E3A8A;
      font-weight: 700;
    }

    .w-tie {
      color: #78350F;
      font-weight: 600;
    }

    .btn-clear {
      font-size: 0.75rem;
      padding: 2px 8px;
      border: 1px solid #BBB;
      border-radius: 4px;
      background: #FFF;
      cursor: pointer;
      color: #555;
    }

    .btn-clear:hover {
      background: #EEE;
    }

    /* Status (district results summary, inside the Districts box) */

    .status-row {
      font-size: 0.875rem;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #DDD;
    }

    .split-label {
      font-weight: 600;
    }

    .split-red {
      color: #991B1B;
    }

    .split-blue {
      color: #1E3A8A;
    }

    .split-tie {
      color: #78350F;
    }

    .split-pending {
      color: #888;
    }

    /* Completion message (non-modal, below the map) */

    .completion-msg {
      margin: 4px 0 0;
      padding: 10px 14px;
      border-radius: 6px;
      background: #DCFCE7;
      border: 1px solid #86EFAC;
      color: #166534;
      font-weight: 600;
      font-size: 0.9rem;
      max-width: 520px;
    }

    .completion-msg[hidden] {
      display: none;
    }

    .takeaways-link {
      display: inline-block;
      margin-top: 24px;
      font-size: 0.875rem;
      color: #0070C0;
      text-decoration: none;
    }

    .takeaways-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <nav>
    <a class="exit-link" href="puzzles.html">&#8592; Instructions</a>
    &nbsp;&middot;&nbsp;
    <a class="exit-link" href="../../">Home</a>
  </nav>
  <h1>Redistricting Puzzles</h1>

  <div class="puzzle-controls">
    <label for="puzzle-select">Puzzle:</label>
    <select id="puzzle-select" onchange="selectPuzzle(+this.value)">
      <option value="0">1 &#8212; Proportional</option>
      <option value="1">2 &#8212; Sweetheart</option>
      <option value="2">3 &#8212; Packing (Red into 1)</option>
      <option value="3">4 &#8212; Cracking (Blue across 3)</option>
      <option value="4">5 &#8212; Competitive</option>
    </select>
    <button class="btn-reset" onclick="resetPuzzle()">Reset</button>
    <button class="btn-reset" onclick="loadSolution()">Solution</button>
    <button class="btn-reset" onclick="saveMap()">Save</button>
    <button class="btn-reset" onclick="document.getElementById('load-input').click()">Load</button>
    <input type="file" id="load-input" accept="application/json,.json" style="display:none"
      onchange="loadMap(event)">
  </div>

  <div class="view-controls">
    <span>View:</span>
    <label><input type="radio" name="view-mode" value="map" checked onchange="setViewMode('map')"> Map Colors</label>
    <label><input type="radio" name="view-mode" value="lean" onchange="setViewMode('lean')"> Partisan
      Lean</label>
  </div>

  <p class="puzzle-goal" id="puzzle-goal"></p>
  <p class="puzzle-hint" id="puzzle-hint"></p>

  <div class="game-area">
    <div class="districts-col">
      <div class="section-label">Districts</div>
      <div class="districts-box">
        <table class="district-panel" id="district-panel">
        <thead>
          <tr>
            <th colspan="2" class="left">District</th>
            <th>Assigned</th>
            <th>#R</th>
            <th>#B</th>
            <th title="Contiguous">&#9632;&#9632;</th>
            <th>Winner</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="district-tbody"></tbody>
      </table>
        <div class="status-row" id="split-row"></div>
      </div>
    </div>
    <div class="map-col">
      <div class="section-label">Map</div>
      <svg id="grid" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <div class="completion-msg" id="completion-msg" hidden></div>

  <a class="takeaways-link" href="completion.html">Takeaways &#8594;</a>

  <script>
    // ── Political geography: 8×8 grid from pg.txt ──────────────────────────────
    // R = Red, B = Blue. 32 R and 32 B.

    const PG = [
      ['B', 'B', 'R', 'R', 'R', 'B', 'B', 'B'],
      ['B', 'B', 'R', 'R', 'R', 'R', 'B', 'B'],
      ['B', 'R', 'R', 'B', 'B', 'R', 'R', 'R'],
      ['R', 'R', 'B', 'B', 'B', 'B', 'R', 'R'],
      ['R', 'R', 'B', 'B', 'B', 'B', 'R', 'R'],
      ['R', 'R', 'R', 'B', 'B', 'R', 'R', 'B'],
      ['B', 'B', 'R', 'R', 'R', 'R', 'B', 'B'],
      ['B', 'B', 'B', 'R', 'R', 'R', 'B', 'B'],
    ];

    // ── Constants ───────────────────────────────────────────────────────────────

    const ROWS = 8, COLS = 8;
    const N_DISTRICTS = 4;
    const CELLS_PER_DISTRICT = 16;
    const CELL_SIZE = 50;
    const DOT_R = 13;
    const SVG_NS = 'http://www.w3.org/2000/svg';

    // ── Colors ──────────────────────────────────────────────────────────────────

    // Voter dot: solid party fill, white letter.
    const PARTY_COLOR = {R: '#DC2626', B: '#2563EB'};

    // District identification: one border/swatch color per district.
    const DISTRICT_BORDER = ['#f2f822', '#1a068c', '#cf4a75', '#f99740'];

    // District fill in Map Colors mode.
    const DISTRICT_MAP_FILL = [
      'rgba(242,248,34,0.50)',
      'rgba(26,6,140,0.50)',
      'rgba(207,74,117,0.50)',
      'rgba(249,151,64,0.50)',
    ];

    // Cell background fill in Partisan Lean mode.
    const WINNER_FILL = {
      R: 'rgba(239,68,68,0.38)',
      B: 'rgba(59,130,246,0.38)',
      T: 'rgba(234,179,8,0.42)',
      I: 'rgba(210,210,210,0.22)',   // assigned, in progress
      U: 'rgba(220,220,220,0.15)',   // unassigned
    };

    // ── Puzzles ─────────────────────────────────────────────────────────────────

    const PUZZLES = [
      {
        name: 'proportional',
        goal: 'Goal: Draw 2 Red-leaning-but-competitive districts and 2 similar Blue-leaning districts.',
        hint: 'Hint: With this political geography, you can draw 2 9-7 Red-leaning and 2 9-7 Blue-leaning districts.',
        target: {R: 2, B: 2, T: 0},
      },
      {
        name: 'sweetheart',
        goal: 'Goal: Draw 2 safe Red districts and 2 safe Blue districts.',
        hint: 'Hint: With this political geography, you can draw 2 lopsided Red districts (11–5) and 2 lopsided Blue districts (11–5).',
        target: {R: 2, B: 2, T: 0},
      },
      {
        name: 'packing',
        goal: 'Goal: Pack Red voters into 1 district; Blue wins the other 3.',
        hint: 'Hint: With this political geography, you can pack 16 Red voters into 1 district giving Blue 3 safe districts with 10-11 voters.',
        target: {R: 1, B: 3, T: 0},
      },
      {
        name: 'cracking',
        goal: 'Goal: Crack Blue voters across 3 Red-winning districts; Blue keeps only 1.',
        hint: 'Hint: With this political geography, you can draw 3 9–7 Red-leaning districts and 1 11–5 Blue district.',
        target: {R: 3, B: 1, T: 0},
      },
      {
        name: 'competitive',
        goal: 'Goal: Draw 4 districts that have exactly equal numbers of Red and Blue voters.',
        hint: 'Hint: With this political geography, you can draw 4 perfectly competitive (8–8) districts.',
        target: {R: 0, B: 0, T: 4},
      },
    ];

    // ── State ───────────────────────────────────────────────────────────────────

    let currentPuzzle = 0;
    let currentDistrict = 1;
    let assignments = new Array(ROWS * COLS).fill(0);  // 0 = unassigned
    let showPartisanLean = false;

    const cellIdx = (r, c) => r * COLS + c;

    // ── Completion tracking ──────────────────────────────────────────────────────

    const STORAGE_KEY = 'redistricting_v3_solved';

    function getSolvedSet()
    {
      try
      {
        return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
      } catch {return new Set();}
    }

    // ── Logic ───────────────────────────────────────────────────────────────────

    function squareNeighbors(r, c)
    {
      return [[-1, 0], [1, 0], [0, -1], [0, 1]]
        .map(([dr, dc]) => [r + dr, c + dc])
        .filter(([nr, nc]) => nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS);
    }

    function isContiguous(d, cells)
    {
      if (cells.length === 0) return true;
      const inD = new Set(cells.map(([r, c]) => cellIdx(r, c)));
      const visited = new Set([cellIdx(cells[0][0], cells[0][1])]);
      const queue = [cells[0]];
      while (queue.length)
      {
        const [r, c] = queue.shift();
        for (const [nr, nc] of squareNeighbors(r, c))
        {
          const ni = cellIdx(nr, nc);
          if (inD.has(ni) && !visited.has(ni))
          {
            visited.add(ni);
            queue.push([nr, nc]);
          }
        }
      }
      return visited.size === cells.length;
    }

    function districtResult(d)
    {
      let R = 0, B = 0;
      const cells = [];
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (assignments[cellIdx(r, c)] === d)
          {
            PG[r][c] === 'R' ? R++ : B++;
            cells.push([r, c]);
          }
      const size = R + B;
      const contiguous = isContiguous(d, cells);
      let winner = null;
      if (size === CELLS_PER_DISTRICT)
        winner = R > B ? 'R' : B > R ? 'B' : 'T';
      return {size, R, B, contiguous, winner};
    }

    function partisanFillColor(size, R, B)
    {
      if (size === 0) return WINNER_FILL.U;
      if (R === B)
      {
        // Tied: yellow, deepening as more cells are assigned.
        const opacity = (0.25 + (size / CELLS_PER_DISTRICT) * 0.25).toFixed(2);
        return `rgba(234,179,8,${opacity})`;
      }
      // Lead-proportional opacity: faint at 1-cell edge, full at 16-0.
      const lead = Math.abs(R - B);
      const opacity = (0.20 + (lead / CELLS_PER_DISTRICT) * 0.30).toFixed(2);
      return R > B ? `rgba(239,68,68,${opacity})` : `rgba(59,130,246,${opacity})`;
    }

    function cellFillColor(d, results)
    {
      if (d === 0) return WINNER_FILL.U;
      if (!showPartisanLean) return DISTRICT_MAP_FILL[d - 1];
      const res = results[d - 1];
      return partisanFillColor(res.size, res.R, res.B);
    }

    // ── Actions ─────────────────────────────────────────────────────────────────

    function handleCellClick(r, c)
    {
      const i = cellIdx(r, c);
      assignments[i] = assignments[i] === currentDistrict ? 0 : currentDistrict;
      tryAutofillFourth();
      render();
    }

    function tryAutofillFourth()
    {
      const sizes = new Array(N_DISTRICTS + 1).fill(0);
      for (const a of assignments) if (a > 0) sizes[a]++;

      const complete = [];
      const incomplete = [];
      for (let d = 1; d <= N_DISTRICTS; d++)
      {
        if (sizes[d] === CELLS_PER_DISTRICT) complete.push(d);
        else incomplete.push(d);
      }

      if (complete.length === N_DISTRICTS - 1 && incomplete.length === 1)
      {
        const d4 = incomplete[0];
        for (let i = 0; i < assignments.length; i++)
          if (assignments[i] === 0) assignments[i] = d4;
        currentDistrict = d4;
      }
    }

    function setViewMode(mode)
    {
      showPartisanLean = mode === 'lean';
      render();
    }

    function selectPuzzle(i)
    {
      currentPuzzle = i;
      assignments = new Array(ROWS * COLS).fill(0);
      currentDistrict = 1;
      render();
    }

    function resetPuzzle()
    {
      assignments = new Array(ROWS * COLS).fill(0);
      render();
    }

    async function loadSolution()
    {
      const hasWork = assignments.some(a => a !== 0);
      if (hasWork && !confirm('Load the solution? This will replace your current map.')) return;
      try
      {
        const name = PUZZLES[currentPuzzle].name;
        const resp = await fetch(`solutions/${name}.json`, {cache: 'no-store'});
        if (!resp.ok) throw new Error('fetch failed');
        if (!applyAssignments(await resp.json())) throw new Error('invalid');
      } catch
      {
        alert('Could not load the solution for this puzzle.');
      }
    }

    function resetDistrict(d)
    {
      for (let i = 0; i < assignments.length; i++)
        if (assignments[i] === d) assignments[i] = 0;
      currentDistrict = d;
      render();
    }

    // ── Save / Load (voter→district assignments only) ─────────────────────────────

    async function saveMap()
    {
      const data = JSON.stringify({version: 1, assignments});

      // Preferred: native save dialog (name + location). Chromium browsers only.
      if (window.showSaveFilePicker)
      {
        try
        {
          const handle = await window.showSaveFilePicker({
            suggestedName: 'redistricting-map.json',
            types: [{description: 'Redistricting map', accept: {'application/json': ['.json']}}],
          });
          const writable = await handle.createWritable();
          await writable.write(data);
          await writable.close();
          return;
        } catch (e)
        {
          if (e.name === 'AbortError') return;  // user cancelled the dialog
          // any other failure: fall through to the download fallback
        }
      }

      // Fallback: browser download (the filename is only a suggestion).
      const blob = new Blob([data], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'redistricting-map.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    // Validate and apply a loaded map. Accepts a bare array or a {assignments}
    // object. Returns true on success, false if the data isn't a valid map.
    function applyAssignments(raw)
    {
      const a = Array.isArray(raw) ? raw : (raw && raw.assignments);
      const valid = Array.isArray(a)
        && a.length === ROWS * COLS
        && a.every(v => Number.isInteger(v) && v >= 0 && v <= N_DISTRICTS);
      if (!valid) return false;
      assignments = a.slice();
      currentDistrict = 1;
      render();
      return true;
    }

    function loadMap(event)
    {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () =>
      {
        try
        {
          if (!applyAssignments(JSON.parse(reader.result))) throw new Error('invalid map file');
        } catch
        {
          alert("Could not load that file — it doesn't look like a saved map.");
        }
        event.target.value = '';  // allow re-loading the same file
      };
      reader.readAsText(file);
    }

    // ── Rendering ────────────────────────────────────────────────────────────────

    function render()
    {
      const results = Array.from({length: N_DISTRICTS}, (_, i) => districtResult(i + 1));
      renderGrid(results);
      renderDistrictPanel(results);
      renderStatusBar(results);
    }

    function renderGrid(results)
    {
      const svg = document.getElementById('grid');
      svg.innerHTML = '';
      const PAD = 2;  // half of the 4px border stroke, so edge strokes aren't clipped
      svg.setAttribute('width', COLS * CELL_SIZE + PAD * 2);
      svg.setAttribute('height', ROWS * CELL_SIZE + PAD * 2);
      svg.removeAttribute('viewBox');
      const g = document.createElementNS(SVG_NS, 'g');
      g.setAttribute('transform', `translate(${PAD}, ${PAD})`);
      svg.appendChild(g);

      for (let r = 0; r < ROWS; r++)
      {
        for (let c = 0; c < COLS; c++)
        {
          const i = cellIdx(r, c);
          const d = assignments[i];
          const x = c * CELL_SIZE;
          const y = r * CELL_SIZE;
          const cx = x + CELL_SIZE / 2;
          const cy = y + CELL_SIZE / 2;

          const rect = document.createElementNS(SVG_NS, 'rect');
          rect.setAttribute('x', x + 0.5);
          rect.setAttribute('y', y + 0.5);
          rect.setAttribute('width', CELL_SIZE - 1);
          rect.setAttribute('height', CELL_SIZE - 1);
          rect.setAttribute('fill', cellFillColor(d, results));
          rect.setAttribute('stroke', 'rgba(0,0,0,0.5)');
          rect.setAttribute('stroke-width', '1');
          rect.style.cursor = 'pointer';

          rect.addEventListener('mouseenter', () =>
          {
            const cur = assignments[i];
            if (cur !== currentDistrict)
              rect.setAttribute('fill', cellFillColor(currentDistrict, results));
          });
          rect.addEventListener('mouseleave', () =>
          {
            const cur = assignments[i];
            rect.setAttribute('fill', cellFillColor(cur, results));
          });
          rect.addEventListener('click', () => handleCellClick(r, c));
          g.appendChild(rect);

          // Voter dot: solid party-colored circle (reduced opacity), white letter.
          const dot = document.createElementNS(SVG_NS, 'circle');
          dot.setAttribute('cx', cx);
          dot.setAttribute('cy', cy);
          dot.setAttribute('r', DOT_R);
          dot.setAttribute('fill', PARTY_COLOR[PG[r][c]]);
          dot.setAttribute('fill-opacity', '0.72');
          dot.style.pointerEvents = 'none';
          g.appendChild(dot);

          const label = document.createElementNS(SVG_NS, 'text');
          label.setAttribute('x', cx);
          label.setAttribute('y', cy);
          label.setAttribute('text-anchor', 'middle');
          label.setAttribute('dominant-baseline', 'central');
          label.setAttribute('fill', 'white');
          label.setAttribute('font-size', '12');
          label.setAttribute('font-weight', '700');
          label.setAttribute('font-family', 'sans-serif');
          label.style.pointerEvents = 'none';
          label.textContent = PG[r][c];
          g.appendChild(label);
        }
      }

      renderDistrictBorders(g);
      renderStateBorder(g);
    }

    function renderStateBorder(svg)
    {
      const rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('x', 0);
      rect.setAttribute('y', 0);
      rect.setAttribute('width', COLS * CELL_SIZE);
      rect.setAttribute('height', ROWS * CELL_SIZE);
      rect.setAttribute('fill', 'none');
      rect.setAttribute('stroke', '#000');
      rect.setAttribute('stroke-width', '4');
      rect.setAttribute('stroke-linejoin', 'miter');
      rect.style.pointerEvents = 'none';
      svg.appendChild(rect);
    }

    function renderDistrictBorders(svg)
    {
      for (let d = 1; d <= N_DISTRICTS; d++)
      {
        const inD = new Set();
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            if (assignments[cellIdx(r, c)] === d) inD.add(cellIdx(r, c));

        if (inD.size === 0) continue;

        for (const idx of inD)
        {
          const r = Math.floor(idx / COLS);
          const c = idx % COLS;
          const x = c * CELL_SIZE;
          const y = r * CELL_SIZE;

          const edges = [
            {dr: -1, dc: 0, x1: x, y1: y, x2: x + CELL_SIZE, y2: y},
            {dr: 0, dc: 1, x1: x + CELL_SIZE, y1: y, x2: x + CELL_SIZE, y2: y + CELL_SIZE},
            {dr: 1, dc: 0, x1: x, y1: y + CELL_SIZE, x2: x + CELL_SIZE, y2: y + CELL_SIZE},
            {dr: 0, dc: -1, x1: x, y1: y, x2: x, y2: y + CELL_SIZE},
          ];

          for (const {dr, dc, x1, y1, x2, y2} of edges)
          {
            const nr = r + dr, nc = c + dc;
            const neighborInD = nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS
              && inD.has(cellIdx(nr, nc));

            if (!neighborInD)
            {
              const line = document.createElementNS(SVG_NS, 'line');
              line.setAttribute('x1', x1);
              line.setAttribute('y1', y1);
              line.setAttribute('x2', x2);
              line.setAttribute('y2', y2);
              line.setAttribute('stroke', '#000');
              line.setAttribute('stroke-width', '4');
              line.setAttribute('stroke-linecap', 'square');
              line.style.pointerEvents = 'none';
              svg.appendChild(line);
            }
          }
        }
      }
    }

    function renderDistrictPanel(results)
    {
      const tbody = document.getElementById('district-tbody');
      tbody.innerHTML = '';

      for (let d = 1; d <= N_DISTRICTS; d++)
      {
        const res = results[d - 1];
        const tr = document.createElement('tr');
        tr.className = 'd-row' + (d === currentDistrict ? ' active' : '');
        tr.addEventListener('click', () =>
        {
          currentDistrict = d;
          render();
        });

        const tdSwatch = document.createElement('td');
        tdSwatch.className = 'left';
        tdSwatch.innerHTML = `<span class="swatch" style="background:${DISTRICT_BORDER[d - 1]}"></span>`;

        const tdNum = document.createElement('td');
        tdNum.className = 'd-num left';
        tdNum.textContent = d;

        const tdAssigned = document.createElement('td');
        tdAssigned.className = 'num-cell';
        tdAssigned.textContent = `${res.size}/${CELLS_PER_DISTRICT}`;

        const tdR = document.createElement('td');
        tdR.className = 'num-cell';
        tdR.textContent = res.size > 0 ? res.R : '—';

        const tdB = document.createElement('td');
        tdB.className = 'num-cell';
        tdB.textContent = res.size > 0 ? res.B : '—';

        const tdC = document.createElement('td');
        if (res.size === 0)
        {
          tdC.className = 'c-na';
          tdC.textContent = '—';
        } else if (res.contiguous)
        {
          tdC.className = 'c-yes';
          tdC.textContent = '✓';
        } else
        {
          tdC.className = 'c-no';
          tdC.textContent = '✗';
        }

        const tdW = document.createElement('td');
        if (res.winner === 'R')
        {
          tdW.className = 'w-red';
          tdW.textContent = 'R';
        } else if (res.winner === 'B')
        {
          tdW.className = 'w-blue';
          tdW.textContent = 'B';
        } else if (res.winner === 'T')
        {
          tdW.className = 'w-tie';
          tdW.textContent = 'Tie';
        } else
        {
          tdW.className = 'c-na';
          tdW.textContent = '—';
        }

        const tdClear = document.createElement('td');
        const clearBtn = document.createElement('button');
        clearBtn.className = 'btn-clear';
        clearBtn.textContent = 'Reset';
        clearBtn.title = `Unassign all voters from district ${d}`;
        clearBtn.disabled = res.size === 0;
        clearBtn.addEventListener('click', (e) =>
        {
          e.stopPropagation();  // don't trigger the row's select handler
          resetDistrict(d);
        });
        tdClear.appendChild(clearBtn);

        tr.append(tdSwatch, tdNum, tdAssigned, tdR, tdB, tdC, tdW, tdClear);
        tbody.appendChild(tr);
      }
    }

    function renderStatusBar(results)
    {
      const rWins = results.filter(r => r.winner === 'R' && r.contiguous).length;
      const bWins = results.filter(r => r.winner === 'B' && r.contiguous).length;
      const ties = results.filter(r => r.winner === 'T' && r.contiguous).length;
      const incomplete = N_DISTRICTS - rWins - bWins - ties;

      let split = '<span class="split-label">District results:&nbsp;</span>';
      split += `<span class="split-red">Red: ${rWins}</span>`;
      split += '&nbsp;&nbsp;';
      split += `<span class="split-blue">Blue: ${bWins}</span>`
      split += '&nbsp;&nbsp;';
      split += `<span class="split-tie">Ties: ${ties}</span>`;
      if (incomplete > 0)
        split += `&nbsp;&nbsp;<span class="split-pending">(${incomplete} district${incomplete !== 1 ? 's' : ''} incomplete)</span>`;
      document.getElementById('split-row').innerHTML = split;

      const puzzle = PUZZLES[currentPuzzle];
      document.getElementById('puzzle-goal').textContent = puzzle.goal;
      document.getElementById('puzzle-hint').textContent = puzzle.hint;

      const allAssigned = assignments.every(a => a !== 0);
      const allComplete = results.every(r => r.size === CELLS_PER_DISTRICT);
      const allContiguous = results.every(r => r.contiguous);
      const solved = allAssigned && allComplete && allContiguous
        && rWins === puzzle.target.R
        && bWins === puzzle.target.B
        && ties === puzzle.target.T;

      if (solved)
      {
        const solvedSet = getSolvedSet();
        solvedSet.add(currentPuzzle);
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...solvedSet]));
        const msg = solvedSet.size === PUZZLES.length
          ? "Congratulations! You’ve solved all five puzzles!"
          : `Puzzle solved! You drew a ${puzzle.name} map.`;
        showCompletion(msg);
      } else
      {
        hideCompletion();
      }
    }

    // ── Completion message ─────────────────────────────────────────────────────────

    function showCompletion(msg)
    {
      const el = document.getElementById('completion-msg');
      el.textContent = msg;
      el.hidden = false;
    }

    function hideCompletion()
    {
      document.getElementById('completion-msg').hidden = true;
    }

    // ── Init ─────────────────────────────────────────────────────────────────────

    render();
  </script>
</body>

</html>
